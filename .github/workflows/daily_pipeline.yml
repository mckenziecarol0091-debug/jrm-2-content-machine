name: Daily Content Pipeline

on:
  schedule:
    # 9 AM PST = 17:00 UTC, weekdays only (Mon-Fri)
    - cron: '0 17 * * 1-5'
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google credentials file
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > jrm-social-ce1b2857fb3c.json

      - name: Create .env file
        run: |
          cat <<EOF > .env
          GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_FILE=jrm-social-ce1b2857fb3c.json
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Run pipeline
        run: python script_writer.py
